name: harmony_interview
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to 
version: 1.0.0+1
environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  interview_core:
    path: ../../common/core
  interview_widgets:
    path: ../../common/widgets
  tech_precise_timer:
    path: ../../tech/precise_timer
  tech_router_guide:
    path: ../../tech/router_guide
  tech_state_management:
    path: ../../tech/state_management
  tech_di_guide:
    path: ../../tech/di_guide
  tech_http_client:
    path: ../../tech/http_client
  tech_custom_painter:
    path: ../../tech/custom_painter
  tech_animation:
    path: ../../tech/animation
  tech_local_storage:
    path: ../../tech/local_storage
  tech_event_queue:
    path: ../../tech/event_queue
  tech_repaint_boundary:
    path: ../../tech/repaint_boundary

dependency_overrides:
  permission_handler:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_permission_handler.git
      path: permission_handler

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

