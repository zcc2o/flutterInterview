name: flutter-interview

packages:
  - packages/apps/**
  - packages/common/**
  - packages/tech/**
  - packages/features/**
  - packages/interfaces/**

scripts:
  analyze:
    exec: dart analyze .
  generate:
    run: melos exec -- "dart run build_runner build --delete-conflicting-outputs" --no-private
  test:
    run: melos exec -- "flutter test" --no-private
  clean:
    exec: flutter clean

  bootstrap:ohos:
    run: |
      melos bootstrap
      fvm flutter pub get
    description: Bootstrap workspace with HarmonyOS overrides.
  build:ohos:
    run: |
      cd packages/apps/harmony_interview
      fvm flutter pub get
      fvm flutter build hap
    description: Build HarmonyOS app with overrides.